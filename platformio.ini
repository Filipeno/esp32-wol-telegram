; Wake-on-LAN spínač ovládaný přes Telegram
; Deska: ESP32 DevKit (ESP32-WROOM-32)
;
; Všechny verze jsou zafixované, aby se projekt za rok zkompiloval stejně jako dnes.

[env:esp32dev]
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_deps =
    witnessmenow/UniversalTelegramBot @ 1.3.0
    bblanchon/ArduinoJson @ 7.4.3
    a7md0/WakeOnLan @ 1.1.7
    marian-craciunescu/ESP32Ping @ 1.7
    tzapu/WiFiManager @ 2.0.17

build_flags =
    -DCORE_DEBUG_LEVEL=0

; Nahrání přes Wi-Fi (OTA): pio run -e ota -t upload
; Heslo se bere z OTA_PASSWORD v include/secrets.h (viz scripts/ota_auth.py).
; Když wol-spinac.local nejde najít, přidej: --upload-port <IP ESP32>
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = wol-spinac.local
extra_scripts = pre:scripts/ota_auth.py
